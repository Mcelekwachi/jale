[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI Depends()/Query() in defaults is the documented pattern
  "UP042",  # str+Enum is deliberate: widest Pydantic/FastAPI compatibility
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
