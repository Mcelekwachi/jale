# Jalɛ — Igbo language definition
# Adding a new language = copying this file into content/<code>/ and editing it.

language:
  code: ibo                 # ISO 639-3
  name: Igbo
  endonym: Asụsụ Igbo
  flag_emoji: "🇳🇬"
  is_active: true
  sort_order: 10

dialects:
  - code: central
    name: Central Igbo
    is_default: true
  # Phase 2 candidates — rows only, no code change:
  # - { code: owerri,  name: Owerri Igbo,  is_default: false }
  # - { code: onitsha, name: Onitsha Igbo, is_default: false }
  # - { code: aro,     name: Arochukwu Igbo, is_default: false }

# Tone policy for this language (enforced as a warning by seed.py)
tone_policy:
  toned_content_types: [phrase, proverb]   # words stay plain for now
  note: >
    target_text_toned is populated per content item, never per lexeme.
    Leave blank until a verified native contributor supplies the marking.

