# Render blueprint. Commit this and point Render at the repo to provision the
# API against the externally managed Supabase database.
#
# Render builds the API from backend/Dockerfile in this repository.

services:
  - type: web
    name: jale-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt          # closest to the Netherlands
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_LANGUAGE
        value: ibo
      - key: DEFAULT_META_LANGUAGE
        value: eng
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false            # set to your Vercel URLs in the dashboard
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      # First deploy: set both to true so the container builds and seeds the
      # database itself. They are idempotent and advisory-locked, so leaving
      # them on is safe — turn them off once you move to real migrations.
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: SEED_LANGUAGES
        value: ibo
