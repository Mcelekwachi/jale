name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Content validation needs no database, so it fails in seconds on a bad CSV
  # rather than after a full Postgres spin-up.
  content:
    name: Validate content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r db/seed/requirements.txt
      - name: Validate every language pack
        run: python db/seed/seed.py --all --dry-run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.8.4
      - run: ruff check backend db
      - run: ruff format --check backend db

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [content]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jale
          POSTGRES_PASSWORD: jale
          POSTGRES_DB: jale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jale:jale@localhost:5432/jale_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Run suite
        working-directory: backend
        run: pytest -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only — publishing happens in release.yml on main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: jale-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the built image
        run: |
          docker run --rm \
            -e SUPABASE_PROJECT_URL=https://example.supabase.co \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            --entrypoint python jale-api:ci \
            -c "from app.main import create_app; create_app(); print('app imports and builds')"
