name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-idempotency:
    name: Schema idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jale
          POSTGRES_PASSWORD: jale
          POSTGRES_DB: jale_fresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRESH_DATABASE_URL: postgresql://jale:jale@localhost:5432/jale_fresh
      HISTORICAL_DATABASE_URL: postgresql://jale:jale@localhost:5432/jale_historical
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r db/seed/requirements.txt
      - name: Create historical-upgrade database
        shell: bash
        run: |
          python -c "import psycopg; connection = psycopg.connect('postgresql://jale:jale@localhost:5432/postgres', autocommit=True); connection.execute('CREATE DATABASE jale_historical'); connection.close()"
          git show 8b406de:db/schema.sql > "$RUNNER_TEMP/schema-8b406de.sql"
      - name: Apply and seed a fresh schema twice
        run: python scripts/verify_schema_idempotency.py fresh --database-url "$FRESH_DATABASE_URL"
      - name: Upgrade the historical production schema
        run: python scripts/verify_schema_idempotency.py historical --database-url "$HISTORICAL_DATABASE_URL" --schema "$RUNNER_TEMP/schema-8b406de.sql"

  # Content validation needs no database, so it fails in seconds on a bad CSV
  # rather than after a full Postgres spin-up.
  content:
    name: Validate content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r db/seed/requirements.txt
      - name: Validate every language pack
        run: python db/seed/seed.py --all --dry-run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.8.4
      - name: Enforce the Igbo language name
        timeout-minutes: 5
        shell: bash
        run: |
          pattern='\b(?:I[bB][oO]|iB[oO]|ibO)\b'
          matches="$({
            grep -RInIP \
              --exclude-dir='node_modules' \
              --exclude-dir='dist' \
              --exclude-dir='.git' \
              --exclude-dir='.venv' \
              --exclude-dir='*pycache*' \
              -- "$pattern" . || true
          } | grep -vE '^\./\.github/workflows/ci\.yml:' \
            | grep -v 'igbo-naming-check:ignore' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            echo '::error::Use “Igbo” for the language name; lowercase “ibo” is the ISO 639-3 code. Offending file and line are listed above.'
            exit 1
          fi
          echo 'Igbo naming check passed.'
      - run: ruff check backend db
      - run: ruff format --check backend db

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [content]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jale
          POSTGRES_PASSWORD: jale
          POSTGRES_DB: jale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jale:jale@localhost:5432/jale_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      # TEMPORARY: remove after JWKS investigation.
      - name: TEMPORARY - Capture JWKS dependency versions
        shell: bash
        run: |
          python --version
          python -m pip freeze | grep -Ei '^(anyio|cryptography|fastapi|httpx|PyJWT|pytest|pytest-asyncio|starlette)=='
          echo 'Install mechanism: pip install -r backend/requirements-dev.txt'
          echo 'Resolution note: requirements files are not a lockfile; PyJWT and transitive dependencies may resolve differently over time.'
      - name: Run suite
        working-directory: backend
        run: pytest -q
      # TEMPORARY: remove after JWKS investigation.
      - name: TEMPORARY - Run JWKS tests in isolation
        if: ${{ always() }}
        working-directory: backend
        run: >-
          pytest -q
          unit_tests/test_auth_jwks.py::test_valid_es256_token_authenticates
          unit_tests/test_auth_jwks.py::test_jwks_is_fetched_once_across_many_tokens
          -p no:cacheprovider

  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only — publishing happens in release.yml on main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: jale-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the built image
        run: |
          docker run --rm \
            -e SUPABASE_PROJECT_URL=https://example.supabase.co \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            --entrypoint python jale-api:ci \
            -c "from app.main import create_app; create_app(); print('app imports and builds')"
