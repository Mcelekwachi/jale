name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  publish:
    name: Publish to GHCR
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # no PAT needed

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [publish]
    if: needs.publish.result == 'success'
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RAILWAY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
    steps:
      # Render and Railway both accept a deploy hook URL. Set whichever you
      # use as a repository secret; the step is skipped if it is absent, so
      # this workflow works before you have picked a host.
      - name: Trigger Render deploy
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK"

      - name: Trigger Railway deploy
        if: env.RAILWAY_HOOK != ''
        run: curl -fsS -X POST "$RAILWAY_HOOK"

      - name: Note when no host is configured
        if: env.RENDER_HOOK == '' && env.RAILWAY_HOOK == ''
        run: echo "Image published. No deploy hook secret set."
